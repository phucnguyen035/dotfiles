onboarding = false

[ui]
agent_panel_sort = "spaces"
hide_tab_bar_when_single_tab = true
status_indicators = "symbols"
pane_borders = true
pane_outer_borders = false
pane_gaps = false
sidebar_collapsed_mode = "hidden"

[ui.toast]
delivery = "herdr"

[keys]
prefix = "ctrl+a"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"
navigate_workspace_down = "shift+j"
navigate_workspace_up = "shift+k"
swap_pane_left = "prefix+alt+h"
swap_pane_right = "prefix+alt+l"
swap_pane_up = "prefix+alt+k"
swap_pane_down = "prefix+alt+j"

[experimental]
pane_history = false

[theme]
name = "catppuccin"
auto_switch = false

### HERDR WORKTRUNK PLUGIN ###
# Override herdr's built-in "new worktree" key (prefix+shift+g) with worktrunk's
# default-branch switch/create picker:
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

### SMART SPLITS ###
# See https://github.com/mrjones2014/smart-splits.nvim#herdr
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"
